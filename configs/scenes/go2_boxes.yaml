# Unitree Go2 (MuJoCo Menagerie, position-controlled MJX variant) with a head camera and a lidar, among six movable
# boxes on a textured ground plane. Field names follow Isaac Lab 3.0 (docs/SCENES.md); quaternions are (x, y, z, w).
#   python -m metalsim.run configs/scenes/go2_boxes.yaml --steps 200 --save runs/scenes/go2_boxes
#   python -m metalsim.run configs/scenes/go2_boxes.yaml --film
name: go2_boxes
num_envs: 4
env_spacing: 4.0
physics: {dt: 0.004, substeps: 5, solver_iterations: 20, ls_iterations: 10}
policy: {type: hold}                     # position actuators hold the standing pose
robot:
  prim_path: "{ENV_REGEX_NS}/Robot"
  spawn: {type: MjcfFileCfg, asset_path: upstream/mujoco_menagerie/unitree_go2/go2_mjx.xml}
  init_state:
    pos: [0.0, 0.0, 0.30]
    rot: [0.0, 0.0, 0.0, 1.0]
    joint_pos: {".*_hip_joint": 0.0, ".*_thigh_joint": 0.9, ".*_calf_joint": -1.8}
objects:
  box:
    count: 6
    spawn:
      type: CuboidCfg
      size: [0.25, 0.25, 0.25]
      mass_props: {mass: 0.8}
      visual_material: {diffuse_color: [0.80, 0.35, 0.15], roughness: 0.6}
      physics_material: {static_friction: 0.8, dynamic_friction: 0.8}
    init_state: {pos: [1.2, -0.9, 0.13]}
    randomize: {pose_range: {x: [-0.3, 0.6], y: [-0.4, 0.4], yaw: [-3.14, 3.14]}}   # reset_root_state_uniform keys
cameras:
  head_cam:                              # mounted on the robot's base link, looking forward
    prim_path: "{ENV_REGEX_NS}/Robot/base/head_cam"
    offset: {pos: [0.30, 0.0, 0.08], rot: [0.0, 0.0, 0.0, 1.0], convention: world}
    width: 640
    height: 360
    data_types: [rgb, distance_to_image_plane, semantic_segmentation]
    spawn: {focal_length: 18.15, horizontal_aperture: 20.955}
    renderer: {tier: 1}
sensors:
  front_lidar:
    prim_path: "{ENV_REGEX_NS}/Robot/base"
    offset: {pos: [0.28, 0.0, 0.12]}
    pattern_cfg: {channels: 16, vertical_fov_range: [-15.0, 15.0], horizontal_fov_range: [-180.0, 180.0], horizontal_res: 1.0}
    max_distance: 20.0
background:
  ground: {type: GroundPlaneCfg, texture_file: tex/train/laminate_floor_02.png, texture_repeat: 0.5, color: [1.0, 1.0, 1.0]}
  dome: {type: DomeLightCfg, texture_file: hdri/train/poly_haven_studio.hdr}
  lights: [{type: DistantLightCfg, direction: [-0.4, 0.3, -0.85], intensity: 0.8}]
film:                                    # python -m metalsim.run ... --film (tier-2 path-traced, offline)
  seconds: 5
  passes: 16
  viewer: {eye: [2.4, -2.2, 1.3], lookat: [0.6, 0.0, 0.2], origin_type: env, fovy: 36}
assets:
  - {name: "Unitree Go2 (go2_mjx.xml)", source: "MuJoCo Menagerie", url: "https://github.com/google-deepmind/mujoco_menagerie/tree/main/unitree_go2", licence: "BSD-3-Clause"}
  - {name: "Studio HDRI (poly_haven_studio)", source: "Poly Haven", url: "https://polyhaven.com/a/poly_haven_studio", licence: "CC0 1.0"}
  - {name: "Floor texture (laminate_floor_02)", source: "Poly Haven", url: "https://polyhaven.com/a/laminate_floor_02", licence: "CC0 1.0"}
