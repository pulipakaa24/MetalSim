[project]
name = "metalsim"
version = "0.0.1"
description = "Isaac Sim / Isaac Lab-parity robot simulation native to Apple silicon: MuJoCo Warp physics on Metal, rendering, sensors, data generation and RL"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT AND Apache-2.0"   # Apache-2.0: the vendored Newton solver, metalsim/physics/mpm/implicit_mpm (THIRD_PARTY_NOTICES.md)
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*"]
authors = [{ name = "Aditya Pulipaka", email = "adipu@utexas.edu" }]
keywords = ["robotics", "simulation", "reinforcement-learning", "apple-silicon", "metal", "mujoco", "isaac-lab"]
# no "License ::" classifier: PEP 639 replaces it with the `license` expression above (setuptools rejects both)
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy",
    "mujoco>=3.14,<3.15",   # the MuJoCo Warp fork (3.14) reads MjModel.flex_internal, which mujoco 3.15 removed
    "warp-lang",   # replaced by the MetalSim fork of Warp: scripts/setup_warp.sh (pulipakaa24/warp, pinned commit of branch metalsim)
    "torch>=2.14",
    "pyobjc-framework-Metal",
    "pyobjc-framework-MetalFX",
    "pyobjc-framework-Cocoa",
    "usd-core",    # pxr: the USD scene layer (metalsim.scene), imported by the G1 task
    "scipy",       # Isaac's rough-terrain generator (metalsim.learn.isaac_terrain)
    "ninja",       # torch.utils.cpp_extension builds the Metal interop bridge (metalsim_torch_metal_bridge) with it
    "pyoidn",      # Open Image Denoise 2.x with its Metal device: tier 2's denoise="oidn" (metalsim.render.denoise)
]

[project.optional-dependencies]
test = ["pytest", "pytest-xdist", "pillow", "imageio", "scipy", "trimesh",   # trimesh: Isaac's terrain reference code in tests/
        "materialx"]   # MaterialX: tests/test_materialx.py (macOS arm64 wheels for CPython 3.9-3.14)
learn = ["gymnasium", "stable-baselines3"]
# the reference learner on MetalSim physics (metalsim.learn.train_g1_rslrl)
rslrl = ["rsl-rl-lib==3.1.2", "tensordict"]
tron1 = ["scipy", "onnxruntime"]
# everything the test suite imports in .venv (zero optional-package skips): the documented install uses it
full = ["metalsim[test,newton,rslrl,tron1]"]
# fidelity protocol against an Isaac recording and the render-fidelity benchmark (metalsim.parity, metalsim.bench)
parity = ["imageio", "imageio-ffmpeg", "pillow", "scikit-image", "lpips", "flip-evaluator"]
# Newton XPBD engine (experimental, archived): the upstream commit the validation runs pinned (newton-physics/newton
# 45458023) plus only the Metal HashTable / 64-bit atomics fix that the Warp fork needs (pulipakaa24/newton branch
# metalsim-hashtable-metal; the same change as patches/newton/metalsim-hashtable-metal-a4be3604.diff on 45458023).
# The MetalSim fork with the solver fixes goes into a separate environment (scripts/setup_newton.sh), Newton 1.5.2
# for MPM into .venv-newton152 (scripts/setup_newton152.sh).
newton = ["newton @ git+https://github.com/pulipakaa24/newton@a4be3604bc218bb366d12164fa3e1025f333bdae",
          "newton-usd-schemas==0.5.0"]   # Newton's USD importer (the G1 Newton-engine task loads the USD asset)

[project.urls]
Homepage = "https://github.com/pulipakaa24/MetalSim"
Repository = "https://github.com/pulipakaa24/MetalSim"
Documentation = "https://github.com/pulipakaa24/MetalSim/blob/main/docs/GUIDE.md"
Issues = "https://github.com/pulipakaa24/MetalSim/issues"
Changelog = "https://github.com/pulipakaa24/MetalSim/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=77"]   # PEP 639 license expression and license-files
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["metalsim*"]

[tool.setuptools.package-data]
"metalsim.physics.mpm.implicit_mpm" = ["NOTICE.txt", "SOURCE.txt"]   # the vendored Newton package's licence notice

[tool.pytest.ini_options]
testpaths = ["tests"]
